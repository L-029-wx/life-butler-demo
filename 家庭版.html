<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>王家的家 · 电子生活管家</title>
<style>
:root{
  --ink:#26221c; --ink2:#4a453c; --mut:#8a8377;
  --paper:#fdfbf4; --paper2:#fffdf7;
  --pencil:#3a3630; --mark:#ffe066; --mark2:#b8e0c8; --mark3:#ffc9c9;
  --red:#c0392b; --amber:#b7791f; --blue:#2c5f8a; --green:#2f7a58;
  --r:16px; --fs:15.5px;
}
body.big{--fs:18px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--ink2); font-size:var(--fs); line-height:1.8;
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  background-color:var(--paper);
  background-image:
    radial-gradient(#e7e0d0 1.05px, transparent 1.05px),
    radial-gradient(#efe9dc .8px, transparent .8px);
  background-size:24px 24px, 24px 24px;
  background-position:0 0, 12px 12px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:790px;margin:0 auto;padding:26px 18px 70px}

/* ---------- 手绘边框（不规则圆角） ---------- */
.doodle{
  border:2.4px solid var(--pencil);
  border-radius:255px 14px 225px 15px/15px 225px 15px 255px;
  background:var(--paper2);
}
.doodle.alt{border-radius:14px 255px 15px 225px/225px 15px 255px 15px}

/* ---------- 顶部 ---------- */
header{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:4px}
/* 手写体只管标题与标签，正文用黑体保证可读 */
h1,h2,.todo-t,.person .n,.row .k,.note p,button,details summary,
.cnt,.k,.todo-h .when{font-family:"楷体","KaiTi","STKaiti","华文楷体",Georgia,serif}
h1{margin:0;font-size:30px;color:var(--ink);font-weight:400;letter-spacing:.02em;position:relative}
h1 .scribble{position:absolute;left:-2px;right:-6px;bottom:-7px;height:12px;overflow:visible}
h1 .scribble path{
  fill:none;stroke:var(--mark);stroke-width:7;stroke-linecap:round;
  stroke-dasharray:220;stroke-dashoffset:220;
  animation:draw .9s .25s ease-out forwards;
}
header .date{font-size:14px;color:var(--mut);padding-bottom:5px}
header .sp{margin-left:auto;display:flex;gap:12px;align-items:center;padding-bottom:2px}

/* ---------- 手绘按钮 ---------- */
button{
  font:inherit;font-size:14.5px;color:var(--ink);cursor:pointer;
  background:var(--paper2);padding:7px 16px;
  border:2.2px solid var(--pencil);
  border-radius:220px 12px 200px 14px/14px 200px 12px 220px;
  transition:transform .12s ease, box-shadow .12s ease, background .15s;
  box-shadow:2.5px 2.5px 0 rgba(38,34,28,.16);
}
button:hover{background:#fff9e8;transform:translate(-1px,-1px) rotate(-.6deg);
  box-shadow:4px 4px 0 rgba(38,34,28,.2)}
button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(38,34,28,.18)}
button.solid{background:var(--ink);color:var(--paper2)}
button.solid:hover{background:#3b352c}
button.mini{font-size:13px;padding:4px 11px;box-shadow:2px 2px 0 rgba(38,34,28,.14)}
button:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}

/* ---------- 问候便签 ---------- */
.note{
  position:relative;margin:22px 0 6px;padding:18px 22px 16px;
  background:#fffdf0;transform:rotate(-.35deg);
  border:2.2px solid var(--pencil);
  border-radius:14px 255px 15px 225px/225px 15px 255px 15px;
  box-shadow:3px 4px 0 rgba(38,34,28,.10);
  animation:up .55s .1s both;
}
.note::before{ /* 胶带 */
  content:"";position:absolute;top:-13px;left:38px;width:74px;height:24px;
  background:linear-gradient(90deg,rgba(255,224,102,.72),rgba(255,224,102,.48));
  border-left:1px dashed rgba(0,0,0,.12);border-right:1px dashed rgba(0,0,0,.12);
  transform:rotate(-2.5deg);box-shadow:0 1px 0 rgba(0,0,0,.05) inset;
  clip-path:polygon(0 0,100% 4%,98% 100%,2% 96%);
}
.note p{margin:0;font-size:17px;color:var(--ink)}
.note b{font-weight:400;background:linear-gradient(transparent 58%, var(--mark) 58%);padding:0 2px}

/* ---------- 区块标题 ---------- */
h2{
  font-size:20px;font-weight:400;color:var(--ink);margin:34px 0 14px;
  display:flex;align-items:center;gap:10px;
}
h2 .cnt{
  font-size:13px;color:var(--ink2);background:#efe9dc;
  border:1.8px solid var(--pencil);border-radius:50%;
  min-width:25px;height:25px;display:grid;place-items:center;line-height:1;
  font-family:ui-monospace,Consolas,monospace;
}
h2 .hl{background:linear-gradient(transparent 55%, var(--mark) 55%);padding:0 4px}

/* ---------- 待办卡 ---------- */
.todo{
  position:relative;margin:0 0 16px;padding:18px 20px 16px;
  background:var(--paper2);
  border:2.4px solid var(--pencil);
  box-shadow:3px 4px 0 rgba(38,34,28,.10);
  animation:up .5s both;
}
.todo:nth-child(odd){border-radius:255px 14px 225px 15px/15px 225px 15px 255px;transform:rotate(-.25deg)}
.todo:nth-child(even){border-radius:14px 255px 15px 225px/225px 15px 255px 15px;transform:rotate(.28deg)}
.todo.red{--accent:var(--red);--accent-bg:#fdf3f1;transform:none!important;
  border-width:2.8px;box-shadow:3px 5px 0 rgba(192,57,43,.14)}
.todo.red::after,.todo.amber::after{content:"";position:absolute;left:-2.4px;top:16px;bottom:16px;
  width:6px;background:var(--accent);border-radius:4px}
.todo.amber{--accent:var(--amber);--accent-bg:#fdf8ee}
.todo.blue{--accent:var(--blue);--accent-bg:#f2f7fb}
.todo.green{--accent:var(--green);--accent-bg:#f1f8f4}
.todo.quiet{--accent:#a9a294;--accent-bg:var(--paper2)}
.todo[class*="red"],.todo[class*="amber"],.todo[class*="blue"],.todo[class*="green"]{
  background:linear-gradient(var(--accent-bg),var(--paper2));
}
.todo-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.todo-ic{flex:0 0 auto;width:26px;height:26px}
.todo-t{font-size:19px;color:var(--ink);line-height:1.45}
.todo-h .when{margin-left:auto;font-size:13px;color:var(--mut);white-space:nowrap}
.todo-b{margin:9px 0 0;color:var(--ink2)}
.todo-b .said{display:block;margin-bottom:4px}
.todo-b .hint{
  display:block;margin-top:7px;padding:8px 12px;font-size:14.5px;color:var(--ink);
  background:rgba(255,255,255,.72);border-left:3.5px solid var(--accent,#b9b2a3);
  border-radius:0 8px 8px 0;
}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}

/* 依据折叠 */
details{display:inline-block;font-size:13.5px}
details summary{
  cursor:pointer;list-style:none;color:var(--mut);
  border-bottom:1.8px dashed #c3bcae;padding-bottom:1px;
}
details summary::-webkit-details-marker{display:none}
details summary:hover{color:var(--ink)}
details p{
  margin:8px 0 0;font-size:13.5px;color:var(--ink2);
  background:#f6f2e8;border:1.6px dashed #cfc8b8;border-radius:10px;padding:10px 13px;line-height:1.75;
}

/* 完成态：划掉 */
.todo.done{animation:none;opacity:.55}
.todo.done .todo-t{text-decoration:line-through;text-decoration-thickness:2.4px;
  text-decoration-color:var(--red)}

/* ---------- 家里怎么样 ---------- */
.sheet{
  position:relative;background:var(--paper2);padding:6px 20px;
  border:2.4px solid var(--pencil);border-radius:18px 240px 16px 230px/230px 16px 240px 18px;
  box-shadow:3px 4px 0 rgba(38,34,28,.10);transform:rotate(.18deg);
}
.row{display:flex;gap:16px;padding:15px 0;border-bottom:1.6px dashed #ddd5c4;align-items:flex-start}
.row:last-child{border-bottom:0}
.row .k{
  flex:0 0 96px;color:var(--ink);font-size:16px;
  background:linear-gradient(transparent 60%, var(--mark2) 60%);
  align-self:flex-start;
}
.row .v{flex:1;min-width:0}
.row .v .main{color:var(--ink2)}
.row .v .main b{color:var(--ink);font-weight:400;background:linear-gradient(transparent 58%, var(--mark) 58%)}
.row .v .sub{font-size:13.5px;color:var(--mut);margin-top:3px}

/* ---------- 家里人 ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:13px}
.person{
  background:var(--paper2);padding:14px 16px;border:2.2px solid var(--pencil);
  box-shadow:2.5px 3px 0 rgba(38,34,28,.10);
  animation:up .5s both;
}
.person:nth-child(1){border-radius:240px 14px 220px 16px/16px 220px 14px 240px;transform:rotate(-.5deg)}
.person:nth-child(2){border-radius:14px 240px 16px 220px/220px 16px 240px 14px;transform:rotate(.42deg)}
.person:nth-child(3){border-radius:220px 16px 240px 14px/14px 240px 16px 220px;transform:rotate(-.3deg)}
.person .n{font-size:17px;color:var(--ink)}
.person .r{font-size:13px;color:var(--mut);margin-top:1px}
.person .c{font-size:13.5px;color:var(--blue);margin-top:7px}

/* ---------- 页脚 ---------- */
footer{margin-top:36px;padding-top:16px;border-top:2px dashed #d7cfbf;font-size:13.5px;color:var(--mut)}
footer .links{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:8px}
footer a{color:var(--blue);text-decoration:none;border-bottom:1.6px dashed #9db6c8}
footer a:hover{color:var(--ink);border-bottom-style:solid}
.state{display:inline-block;font-size:12.5px;padding:1px 9px;border-radius:20px;
  border:1.6px solid #cfc8b8;color:var(--mut)}
.state.ok{border-color:var(--green);color:var(--green);background:#f1f8f4}
.state.bad{border-color:var(--red);color:var(--red);background:#fdf3f1}

/* ---------- 加载 ---------- */
.pencil{display:inline-block;animation:waggle 1.1s ease-in-out infinite;margin-right:6px}
.loading{color:var(--mut);padding:18px 0}

/* ---------- 动效 ---------- */
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes waggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}

/* 卡片入场错开 */
.todo:nth-of-type(1){animation-delay:.04s}
.todo:nth-of-type(2){animation-delay:.10s}
.todo:nth-of-type(3){animation-delay:.16s}
.todo:nth-of-type(n+4){animation-delay:.22s}

/* ===== 登录卡（替换 prompt，webview 里 prompt 不可用） ===== */
#mask{position:fixed;inset:0;background:rgba(38,34,28,.42);display:none;z-index:60;
  align-items:center;justify-content:center;padding:20px;animation:pop .2s ease-out}
#mask.on{display:flex}
.loginbox{
  width:100%;max-width:360px;background:var(--paper2);padding:24px 24px 20px;position:relative;
  border:2.6px solid var(--pencil);
  border-radius:14px 255px 15px 225px/225px 15px 255px 15px;
  box-shadow:5px 6px 0 rgba(38,34,28,.18);transform:rotate(-.4deg);
}
.loginbox h3{margin:0 0 4px;font-size:22px;font-weight:400;color:var(--ink);
  font-family:"楷体","KaiTi",serif}
.loginbox .sub{font-size:13px;color:var(--mut);margin:0 0 16px}
.chips{display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap}
.chips button{flex:1 1 0;min-width:88px;padding:9px 6px;font-size:14px;line-height:1.35;
  box-shadow:2px 2px 0 rgba(38,34,28,.12)}
.chips button small{display:block;font-size:11.5px;color:var(--mut);margin-top:1px}
.chips button.sel{background:#fff6d8;border-color:var(--pencil);
  box-shadow:2px 2px 0 rgba(38,34,28,.3) inset}
.loginbox label{display:block;font-size:13.5px;color:var(--ink2);margin-bottom:5px;
  font-family:"楷体","KaiTi",serif}
.loginbox input[type=password],.loginbox input[type=text]{
  width:100%;font:inherit;font-size:15px;padding:9px 12px;color:var(--ink);
  background:#fff;border:2px solid var(--pencil);border-radius:10px 3px 10px 3px;outline:none}
.loginbox input:focus{background:#fffdf0;box-shadow:2px 2px 0 rgba(38,34,28,.12)}
.loginbox .err{min-height:20px;font-size:13px;color:var(--red);margin:8px 0 10px}
.loginbox .row2{display:flex;gap:10px}
.loginbox .row2 button{flex:1}
.loginbox .hintline{font-size:12px;color:var(--mut);margin-top:12px;line-height:1.7;
  border-top:1px dashed #ddd5c4;padding-top:10px}
.loginbox .hintline code{background:#eef1f5;border-radius:4px;padding:1px 5px;font-size:11px}

@media(prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
@media(max-width:560px){
  h1{font-size:25px}
  .row{flex-wrap:wrap;gap:4px}
  .row .k{flex:0 0 100%}
}

async function _probe() {

  for (const b of LIVE_BASES) {
    try {

  }

}

async function api(path, opt) {
  opt = opt || {};
  if (opt.method && opt.method !== "GET") throw new Error("演示环境不保存改动");
  const base = await _probe();
  if (base) {
    try {
      const r = await fetch(base + path, { headers: { "Content-Type": "application/json" },
        cache: "no-store" });
      if (r.ok) return await r.json();
    } catch (e) { /* 隧道掉线 → 落回快照 */ }
  }
  const key = path.split("?")[0];
  if (!(key in DEMO)) throw new Error("演示数据缺少 " + key);
  return JSON.parse(JSON.stringify(DEMO[key]));
}

function when(iso) {
  const d = new Date(String(iso).replace(" ", "T"));
  const t0 = new Date(); t0.setHours(0,0,0,0);
  const t1 = new Date(d); t1.setHours(0,0,0,0);
  const diff = Math.round((t0 - t1) / 86400000);
  const hm = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  if (diff === 0) return "今天 " + hm;
  if (diff === 1) return "昨天 " + hm;
  if (diff > 1 && diff < 7) return diff + " 天前 " + hm;
  return (d.getMonth()+1) + "月" + d.getDate() + "日 " + WD[d.getDay()] + " · " + hm;
}

}

function countUp(el, target, ms) {
  ms = ms || 700;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = target; return; }
  const t0 = performance.now();
  const step = t => {
    const k = Math.min(1, (t - t0) / ms);
    el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

  });
  if (!html) html = '<div class="todo quiet">' + ICON.bulb +
    '<span class="todo-t">没有需要处理的事，安心过日子就好。</span></div>';

  const frag = document.createRange().createContextualFragment(html);
  const cards = Array.prototype.slice.call(frag.children);
  const head = cards.slice(0, 3).map(c => c.outerHTML).join("");
  const tail = cards.slice(3).map(c => c.outerHTML).join("");
  $("#todos").innerHTML = '<h2><span class="hl">要你拿主意的事</span><span class="cnt">' + total + '</span></h2>' + head +
    (tail ? '<details style="display:block;margin:4px 0 8px"><summary style="font-size:14px;background:#f3eee0;border:1.8px dashed #cfc8b8;border-radius:12px;padding:9px 14px;display:inline-block">还有 ' +
      (cards.length - 3) + ' 件不急的，想看再点</summary><div style="margin-top:12px">' + tail + '</div></details>' : "");

  const feed = await api("/api/pets/" + pets[0].id + "/feeding");
  const exc = await api("/api/pets/" + pets[0].id + "/excretion");
  let mx = fl.items[0], mn = fl.items[0];
  fl.items.forEach(i => { if (i.score > mx.score) mx = i; if (i.score < mn.score) mn = i; });
  const missed = feed.missed_days.map(d => Number(d.slice(5,7)) + "月" + Number(d.slice(8,10)) + "日").join("、");
  const rows = [
    ["作息", '平时 <b>' + (ro.sleep_start_median || "—") + '</b> 睡、<b>' + (ro.wake_median || "—") + '</b> 起' +
      (ro.sleep_duration_median ? '，一觉 <b>' + ro.sleep_duration_median + '</b>' : ""),
      "这是按你这几周自己的规律算的，不是标准答案。"],
    ["用电", '这周用了 <b>' + su.week_kwh + ' 度</b>，电费 <b>¥' + su.week_yuan + '</b>；便宜时段（夜里）用了 ' +
      Math.round(su.tariff_kwh.valley / su.week_kwh * 100) + '%，贵时段（白天）' +
      Math.round(su.tariff_kwh.peak / su.week_kwh * 100) + '%',
      Number(su.peak_valley_ratio) > 1 ? "白天用电比夜里多 —— 家里白天一直有人。" : "夜里用电比白天多 —— 主要是空调过夜。"],
    ["夜里起夜", '一般 <b>' + (to.night_median_min == null ? "—" : to.night_median_min) + ' 分钟</b>就回来' +
      (to.longest ? '，最长的一次待了 <b>' + to.longest.min + ' 分钟</b>' : "") +
      '；这周夜里起了 <b>' + (to.night_count || 0) + ' 次</b>',
      "只记录时长和次数，是不是异常得由家里人判断。"],
    ["豆豆", '这周喂了 <b>' + feed.records.length + ' 次</b>' +
      (feed.missed_days.length ? '，<b>' + missed + '</b> 少喂了一顿' : "，一顿没落") +
      '；排泄 <b>' + exc.summary.times + ' 次</b>，平均 ' + exc.summary.avg_g + ' 克',
      "称重插件只给读数，健康判断得听兽医的。"],
    ["家里整体", '生活指数 <b id="flqi">0</b>',
      '六项里 <b>' + mx.name + '</b> 最好（' + mx.score + '），<b>' + mn.name + '</b> 最该留意（' +
      mn.score + '）。这是参考数，不是体检结果。']
  ];
  $("#rows").innerHTML = rows.map(r =>
    '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' +
    '<div class="main">' + r[1] + '</div><div class="sub">' + r[2] + '</div></span></div>').join("");
  const fq = $("#flqi"); if (fq) countUp(fq, fl.total);

  $("#people").innerHTML = mems.map(m =>
    '<div class="person"><div class="n">' + esc(m.name) + '</div>' +
    '<div class="r">' + esc(m.role === m.generation ? m.role : m.role + ' · ' + m.generation) + '</div>' +
    '<div class="c">消息通过 ' + esc(m.channel) + '</div></div>').join("");

  bindActions();
}

function bindActions() {
  document.querySelectorAll("[data-ack]").forEach(b => {
    b.onclick = async () => {
      toast("这是演示版：操作不会保存"); return;
      const box = b.closest(".todo");
      try {
        await api("/api/emergency/events/" + b.dataset.ack + "/ack",
          { method: "POST", body: JSON.stringify({ status: b.dataset.st, by: USER }) });
        box.classList.add("done");
        toast(b.dataset.st === "误报" ? "记下了，下次会更谨慎" : "记下了，谢谢你确认");
        setTimeout(load, 900);
      } catch (e) { toast("没成功：" + e.message, true); }
    };
  });
  document.querySelectorAll("[data-fb]").forEach(b => {
    b.onclick = async () => {
      toast("这是演示版：操作不会保存"); return;
      const box = b.closest(".todo");
      try {
        await api("/api/analysis/findings/" + b.dataset.fb + "/feedback",
          { method: "POST", body: JSON.stringify({ action: b.dataset.act, by: USER }) });
        box.classList.add("done");
        toast(b.dataset.act === "采纳" ? "好，照这个做" : "行，这次不用");
        setTimeout(load, 900);
      } catch (e) { toast("没成功：" + e.message, true); }
    };
  });
  document.querySelectorAll("[data-auto]").forEach(b => {
    b.onclick = async () => {
      toast("这是演示版：操作不会保存"); return;
      const box = b.closest(".todo");
      try {
        if (b.dataset.auto) await api("/api/automations/" + b.dataset.auto + "/toggle", { method: "POST" });
        await api("/api/analysis/findings/" + b.dataset.fid + "/feedback",
          { method: "POST", body: JSON.stringify({ action: "采纳", by: USER }) });
        box.classList.add("done");
        toast("以后这种情况会自动处理");
        setTimeout(load, 900);
      } catch (e) { toast("没成功：" + e.message, true); }
    };
  });
}

function toast(msg, bad) {
  const d = document.createElement("div");
  d.textContent = msg;
  d.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%) rotate(-.6deg);" +
    "background:" + (bad ? "#c0392b" : "#26221c") + ";color:#fffdf4;padding:11px 20px;font-size:14.5px;" +
    "border-radius:220px 12px 200px 14px/14px 200px 12px 220px;z-index:99;" +
    "box-shadow:3px 4px 0 rgba(0,0,0,.18);font-family:inherit;animation:pop .28s ease-out";
  document.body.appendChild(d);
  setTimeout(() => {
    d.style.transition = "opacity .35s"; d.style.opacity = "0";
    setTimeout(() => d.remove(), 380);
  }, 2200);
}

$("#btnBig").onclick = () => {
  document.body.classList.toggle("big");
  $("#btnBig").textContent = document.body.classList.contains("big") ? "标准字" : "大字";
};
/* ---- 登录卡（桌面 webview 不支持 window.prompt，必须用页内表单） ---- */
let PICK = "", OLD_PW = "";
const MASK = $("#mask");
function openLogin() {
  $("#loginForm").style.display = "block";
  $("#pwdForm").style.display = "none";
  $("#lgErr").textContent = ""; $("#lgPw").value = "";
  MASK.classList.add("on");
  setTimeout(function () { $("#lgPw").focus(); }, 60);
}
function closeLogin() { MASK.classList.remove("on"); }
document.querySelectorAll(".chips button").forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll(".chips button").forEach(function (x) { x.classList.remove("sel"); });
    b.classList.add("sel"); PICK = b.dataset.user; $("#lgErr").textContent = "";
  };
});
$("#cancelLogin").onclick = closeLogin;
MASK.onclick = function (e) { if (e.target === MASK) closeLogin(); };
$("#lgPw").onkeydown = function (e) { if (e.key === "Enter") $("#doLogin").click(); };
$("#np2").onkeydown = function (e) { if (e.key === "Enter") $("#doPwd").click(); };

$("#doLogin").onclick = async function () {
  const pwv = $("#lgPw").value;
  if (!PICK) { $("#lgErr").textContent = "先选一下你是谁"; return; }
  if (!pwv) { $("#lgErr").textContent = "密码还没填"; return; }
  $("#doLogin").disabled = true; $("#lgErr").textContent = "正在核对…";
  try {
    const r = await api("/api/auth/login", { method: "POST",
      body: JSON.stringify({ username: PICK, password: pwv }) });
    TOKEN = r.token; USER = r.user.display_name + "/" + r.user.role; OLD_PW = pwv;
    localStorage.setItem("lb_token", TOKEN); localStorage.setItem("lb_user", USER);
    $("#btnLogin").textContent = r.user.display_name + " · 退出";
    if (r.must_change_password) {
      $("#loginForm").style.display = "none"; $("#pwdForm").style.display = "block";
      $("#npErr").textContent = ""; $("#np1").value = ""; $("#np2").value = "";
      setTimeout(function () { $("#np1").focus(); }, 60);
    } else {
      closeLogin(); toast("你好，" + r.user.display_name);
    }
    load();
  } catch (e) {
    $("#lgErr").textContent = "没成功：" + e.message;
  } finally { $("#doLogin").disabled = false; }
};

$("#skipPwd").onclick = function () { closeLogin(); toast("好，下次再改"); };
$("#doPwd").onclick = async function () {
  const a = $("#np1").value, b = $("#np2").value;
  if (a.length < 8) { $("#npErr").textContent = "至少 8 位"; return; }
  if (a !== b) { $("#npErr").textContent = "两次输的不一样"; return; }
  $("#doPwd").disabled = true; $("#npErr").textContent = "正在改…";
  try {
    await api("/api/auth/change-password", { method: "POST",
      body: JSON.stringify({ old_password: OLD_PW, new_password: a }) });
    closeLogin(); toast("密码改好了，下次用新的");
  } catch (e) {
    $("#npErr").textContent = "没成功：" + e.message;
  } finally { $("#doPwd").disabled = false; }
};

if ($("#btnLogin")) $("#btnLogin").onclick = function () {
  if (TOKEN) {
    TOKEN = ""; USER = "";
    localStorage.removeItem("lb_token"); localStorage.removeItem("lb_user");
    $("#btnLogin").textContent = "登录"; toast("已退出"); load(); return;
  }
  openLogin();
};


if ($("#btnLogin") && TOKEN) $("#btnLogin").textContent = (USER.split("/")[0] || "已登录") + " · 退出";
load();

</script>
